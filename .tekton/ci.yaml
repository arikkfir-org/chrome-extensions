# Pull-request and merge-queue checks, run by Octomaton in namespace ci-chrome-extensions (see .octomaton.yaml).
# Also runnable by hand: kubectl -n ci-chrome-extensions create -f .tekton/ci.yaml
apiVersion: tekton.dev/v1
kind: PipelineRun
metadata:
  generateName: chrome-extensions-ci-
spec:
  params:
    - name: repo-url
      value: https://github.com/arikkfir-org/chrome-extensions.git
    - name: revision
      value: main
  taskRunTemplate:
    serviceAccountName: pipeline
  # Reserved once for all of the task's steps (step-level requests would add up as if the steps ran at once).
  taskRunSpecs:
    - pipelineTaskName: check
      computeResources:
        requests:
          cpu: 500m
          memory: 256Mi
        limits:
          memory: 512Mi
  timeouts:
    pipeline: 15m
  workspaces:
    - name: source
      emptyDir: {}
  pipelineSpec:
    params:
      - name: repo-url
        type: string
        description: Git URL of the repository.
      - name: revision
        type: string
        description: Commit SHA (or ref) to check.
    workspaces:
      - name: source
    tasks:
      - name: check
        params:
          - name: repo-url
            value: $(params.repo-url)
          - name: revision
            value: $(params.revision)
        workspaces:
          - name: source
            workspace: source
        taskSpec:
          params:
            - name: repo-url
              type: string
            - name: revision
              type: string
          workspaces:
            - name: source
          steps:
            - name: clone
              image: docker.io/alpine/git:v2.54.0
              workingDir: $(workspaces.source.path)
              env:
                - name: REPO_URL
                  value: $(params.repo-url)
                - name: REVISION
                  value: $(params.revision)
              script: |
                #!/bin/sh
                set -eu
                git init -q .
                git remote add origin "${REPO_URL}"
                git fetch -q --depth=1 origin "${REVISION}"
                git checkout -q --detach FETCH_HEAD
                git log -1 --format='%H %s'

            - name: test
              image: docker.io/library/node:22.22.0-alpine3.23
              workingDir: $(workspaces.source.path)
              script: |
                #!/bin/sh
                set -eu
                npm ci --no-audit --no-fund
                npm run format:check
                npm test
